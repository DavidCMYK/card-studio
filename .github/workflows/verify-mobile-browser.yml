name: Verify Card Studio mobile browser

on:
  push:
    branches: [feature/mobile-studio]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build and run unit tests
        run: npm run build:pages
      - name: Install test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run phone and desktop browser tests
        run: node tests/mobile-browser.cjs
      - name: Upload desktop and phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-studio-mobile-test-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
